<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Вопросы</title>
<style>
body {
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    margin-top: 80px;
    overflow: hidden;
}

button {
    padding: 15px 30px;
    font-size: 20px;
    margin: 10px;
    cursor: pointer;
}

#question2, #result {
    display: none;
}

#noBtn1 {
    position: absolute;
}
</style>
</head>
<body>

<div id="question1">
    <h1>
        Я могу поиграть чутка )))<br>
        Ответьте на вопрос:<br><br>
        Вы любите оленьчика?
    </h1>

    <button onclick="showQuestion2()">Да</button>
    <button id="noBtn1">Нет</button>
</div>

<div id="question2">
    <h1>Вы любите дино?</h1>

    <button onclick="showGood()">Да</button>
    <button onclick="showBad()">Нет</button>
</div>

<div id="result">
    <h1 id="resultText"></h1>
</div>

<script>
function showQuestion2() {
    document.getElementById("question1").style.display = "none";
    document.getElementById("question2").style.display = "block";
}

function showGood() {
    document.getElementById("question2").style.display = "none";
    document.getElementById("result").style.display = "block";
    document.getElementById("resultText").innerText =
        "Молодец, я тоже!";
}

function showBad() {
    document.getElementById("question2").style.display = "none";
    document.getElementById("result").style.display = "block";
    document.getElementById("resultText").innerText =
        "Нет? И пошел ты тогда на х";
}

const noBtn = document.getElementById("noBtn1");

document.addEventListener("mousemove", (e) => {
    const rect = noBtn.getBoundingClientRect();

    const distance = Math.sqrt(
        Math.pow(e.clientX - (rect.left + rect.width / 2), 2) +
        Math.pow(e.clientY - (rect.top + rect.height / 2), 2)
    );

    if (distance < 120) {
        const maxX = window.innerWidth - noBtn.offsetWidth;
noBtn.style.left = Math.random() * maxX + "px";
        noBtn.style.top = Math.random() * maxY + "px";
    }
});

noBtn.style.left = "55%";
noBtn.style.top = "260px";
</script>

</body>
</html>
