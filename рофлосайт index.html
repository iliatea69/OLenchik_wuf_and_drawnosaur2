<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Опрос</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    margin:0;
}

.card{
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 0 15px rgba(0,0,0,0.15);
    width:600px;
    max-width:95%;
    text-align:center;
}

button{
    padding:12px 25px;
    margin:10px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:18px;
}

.yes{
    background:#4CAF50;
    color:white;
}

.no{
    background:#f44336;
    color:white;
    position:relative;
}

.hidden{
    display:none;
}

.shapes button{
    font-size:30px;
    width:70px;
    height:70px;
}

#result{
    text-align:left;
}
</style>
</head>
<body>

<div class="card">

    <h2 id="question"></h2>

    <div id="mainButtons">
        <button class="yes" onclick="yesAnswer()">Да</button>
        <button class="no" id="noBtn">Нет</button>
    </div>

    <div id="extra"></div>

</div>

<script>

const questions = [
    {
        text:"Вы любите Оленьчика?",
        type:"special"
    },
    {
        text:"Вы любите Дино?",
        type:"dino"
    },
    {
        text:"Вы любите Снежу?",
        type:"special"
    }
];

let current = 0;
let answers = [];

const questionEl = document.getElementById("question");
const extra = document.getElementById("extra");
const noBtn = document.getElementById("noBtn");

function showQuestion(){
    extra.innerHTML="";
    document.getElementById("mainButtons").style.display="block";

    if(current >= questions.length){
        showResults();
        return;
    }

    questionEl.textContent = questions[current].text;
}

function yesAnswer(){

    if(questions[current].type==="dino"){
        alert("Молодец, я тоже!");
    }

    answers.push({
        question:questions[current].text,
        answer:"Да"
    });

    current++;
    showQuestion();
}

function noAnswer(){

    if(questions[current].type==="dino"){
        alert("Неправильный ответ бубубу");
        answers.push({
            question:questions[current].text,
            answer:"Нет"
        });

        current++;
        showQuestion();
        return;
    }

    document.getElementById("mainButtons").style.display="none";

    extra.innerHTML=`
        <h3>Вы уверены?</h3>
        <button onclick="backToQuestion()">Нет</button>
        <button onclick="showMath()">Да</button>
    `;
}

function backToQuestion(){
    showQuestion();
}

function showMath(){

    extra.innerHTML=`
        <h3>Решите пример:</h3>
        <p>7 + 5 = ?</p>
        <input id="mathAnswer" type="number">
        <br><br>
        <button onclick="checkMath()">Ответить</button>
    `;
}

function checkMath(){

    const val = document.getElementById("mathAnswer").value;

    if(val != 12){
        alert("Неверно!");
        return;
    }

    showShapes();
}

let shapeOrder = [];
const correctOrder = ["circle","square","triangle"];

function showShapes(){

    shapeOrder=[];

    extra.innerHTML=`
        <h3>Нажмите фигуры в правильном порядке</h3>

        <div class="shapes">
            <button onclick="pickShape('circle')">⚪</button>
            <button onclick="pickShape('square')">⬜</button>
            <button onclick="pickShape('triangle')">🔺</button>
        </div>

        <p>Порядок: Круг → Квадрат → Треугольник</p>
    `;
}

function pickShape(shape){

    shapeOrder.push(shape);

    if(shapeOrder.length===3){

        if(JSON.stringify(shapeOrder)!==
           JSON.stringify(correctOrder))
        {
            alert("Неправильный порядок!");
            showShapes();
            return;
        }

        finalConfirm();
    }
}

function finalConfirm(){

    extra.innerHTML=`
        <h3>Вы точно-точно уверены?</h3>

        <button onclick="backToQuestion()">Нет</button>

        <button onclick="acceptNo()">
            Да
        </button>
    `;
}

function acceptNo(){

    alert("Ну и ладно");

    answers.push({
        question:questions[current].text,
        answer:"Нет"
    });

    current++;
    showQuestion();
}

function showResults(){

    questionEl.textContent="Список ответов";
    document.getElementById("mainButtons").style.display="none";

    let html="<div id='result'>";

    answers.forEach(a=>{
        html += `<p><b>${a.question}</b><br>Ответ: ${a.answer}</p>`;
    });

    html += "</div>";

    extra.innerHTML=html;
}

noBtn.addEventListener("mouseover",()=>{

    if(questions[current].type!=="special") return;

    const x = Math.random()*300-150;
    const y = Math.random()*200-100;

    noBtn.style.transform=`translate(${x}px,${y}px)`;
});

noBtn.addEventListener("click",noAnswer);

showQuestion();

</script>

</body>
</html>
